<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>鑑定ハンドブック</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="bar">
  <button id="btnToc" aria-label="メニュー">☰</button><button id="btnSearch" aria-label="検索">🔍</button>
  <button id="btnPrev" aria-label="前のページ">◀</button>
  <form id="jumpForm"><input id="pageInput" type="number" inputmode="numeric" min="1" aria-label="ページ"><span id="pageTotal"></span></form>
  <button id="btnNext" aria-label="次のページ">▶</button>
  <button id="btnZoomOut" aria-label="縮小">−</button>
  <button id="btnZoomIn" aria-label="拡大">＋</button>
  <button id="btnMark" aria-label="しおり">☆</button>
</header>

<main id="stage"><canvas id="canvas"></canvas>
  <div id="empty" hidden>
    <h1>鑑定ハンドブック</h1>
    <p>PDFを一度読み込むと、この端末に保存されて<br>オフラインでもいつでも開けます。</p>
    <button id="btnImport" class="primary">PDFを選択</button>
  </div>
</main>

<aside id="drawer" hidden>
  <div class="tabs">
    <button data-tab="toc" class="on">目次</button>
    <button data-tab="search">検索</button>
    <button data-tab="star">本命星</button>
    <button data-tab="marks">しおり</button>
    <button data-tab="set">設定</button>
    <button id="btnClose" aria-label="閉じる">✕</button>
  </div>
  <section id="tab-toc"><input id="tocFilter" type="search" placeholder="目次を絞り込み（例：五黄、八卦）"><ul id="tocList"></ul></section>

  <section id="tab-search" hidden>
    <form id="searchForm"><input id="q" type="search" placeholder="検索語（空白でAND検索）" enterkeyhint="search"></form>
    <select id="scope" aria-label="検索する項目"></select>
    <p id="searchMsg" class="hint"></p>
    <ul id="results"></ul>
    <details id="idxBox"><summary>検索用の索引</summary>
      <p id="idxStatus" class="hint"></p>
      <div class="row"><button id="idxBuild">索引を作成（OCR）</button><button id="idxStop" hidden>中断</button></div>
      <progress id="idxBar" value="0" max="1" hidden></progress>
      <div class="row"><button id="idxExport">書き出し</button><button id="idxImport">読み込み</button></div>
      <p class="hint">OCRは端末内で実行されます（PCでの実行がおすすめ。数十分かかることがあります）。作成した索引は書き出して、スマホに読み込めます。</p>
    </details>
  </section>

  <section id="tab-star" hidden>
    <label>生年月日<input id="birth" type="date" value="1989-07-11"></label>
    <div id="starOut"></div>
  </section>

  <section id="tab-marks" hidden><ul id="markList"></ul><p class="hint">☆ボタンで現在のページをしおりに追加／削除できます。</p></section>
  <section id="tab-set" hidden>
    <label>ページ補正（PDFのページ ＝ 本の印刷ページ ＋ この値）
      <input id="offset" type="number" value="0"></label>
    <p class="hint">目次の「p.9」を開いて1ページずれる場合は、ここを調整してください（例：表紙が1枚あるなら 1）。</p>
    <label>表示（夜間モード）<select id="theme"><option value="auto">自動</option><option value="light">ライト</option><option value="dark">ダーク（色反転）</option></select></label>
    <button id="btnReimport">PDFを入れ替える</button>
  </section>
</aside>

<input id="file" type="file" accept="application/pdf" hidden>
<input id="idxFile" type="file" accept="application/json,.json" hidden>
<script type="module" src="app.js"></script>
</body>
</html>
